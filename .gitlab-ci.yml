workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        RUNNER_TAG: "cetserver"
        DEPLOY_ENV: "production"

    - if: '$CI_COMMIT_BRANCH == "stage"'
      variables:
        RUNNER_TAG: "cettest"
        DEPLOY_ENV: "staging"

    - when: never

stages:
  - build
  - deploy
  - cleanup

variables:
  STACK_DIR: "/opt/docker-apps/${CI_PROJECT_NAME}"
  IMAGE_NAME: "${CI_PROJECT_PATH_SLUG}"
  KEEP_IMAGES: "2"

build-job:
  stage: build
  image: docker:24
  script:
    - echo "Сборка Docker-образа ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
  tags:
    - $RUNNER_TAG

deploy-job:
  stage: deploy
  image: docker:24
  script:
    - mkdir -p ${STACK_DIR}
    - cp docker-compose.yml ${STACK_DIR}/docker-compose.yml
    - cd ${STACK_DIR}

    - |
      cat > .env <<EOF
      COMPOSE_PROJECT_NAME=$CI_PROJECT_PATH_SLUG
      IMAGE_NAME=$IMAGE_NAME
      CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA
      DB_NAME=$APP_DB_NAME
      DB_USERNAME=$APP_DB_USERNAME
      DB_PASSWORD=$APP_DB_PASSWORD
      DOMAIN=$DOMAIN
      EOF
    - chmod 600 .env
    - docker compose config --quiet
    - docker compose up -d --no-build --remove-orphans
    - docker compose ps
  tags:
    - $RUNNER_TAG
  environment:
    name: $DEPLOY_ENV
  needs: ["build-job"]


cleanup-job:
  stage: cleanup
  image: docker:24
  script:
    - echo "Удаление старых локальных образов ${IMAGE_NAME}, оставляем только последние ${KEEP_IMAGES}"
    - |
      docker images ${IMAGE_NAME} --format "{{.ID}} {{.CreatedAt}}" | \
        sort -r -k2 | \
        tail -n +$((${KEEP_IMAGES} + 1)) | \
        awk '{print $1}' | \
        xargs -r docker rmi 2>/dev/null || true
  tags:
    - $RUNNER_TAG
  needs: ["deploy-job"]
  when: on_success