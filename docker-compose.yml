services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - project-internal
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrator:
    image: "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    restart: no
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_NAME}
    networks:
      - project-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
  backend:
    image: "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_NAME}
    networks:
      - traefik-public
      - project-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/tasks`) || Path(`/docs`) || Path(`/openapi.json`) || Path(`/redoc`))"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.service=${COMPOSE_PROJECT_NAME}-api-service"

      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-api-service.loadbalancer.server.port=8000"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  db_data:

networks:
  traefik-public:
    external: true
    name: traefik-public
  project-internal:
    driver: bridge